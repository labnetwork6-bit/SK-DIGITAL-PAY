<!-- Customer Reviews: insert this section before the Contact section in index.html -->
<section class="section reviews-section" id="reviews">
  <div class="container">
    <div class="section-heading">
      <span class="section-kicker">CUSTOMER FEEDBACK</span>
      <h2>What Our Customers Say</h2>
      <p>Share your experience with SK DIGITAL PAY BD.</p>
    </div>

    <div class="reviews-layout">
      <form class="review-form" id="reviewForm">
        <h3>Write a Review</h3>
        <label for="reviewName">Your Name</label>
        <input id="reviewName" name="name" type="text" maxlength="60"
               placeholder="Enter your name" autocomplete="name" required>

        <span class="review-field-label">Your Rating</span>
        <div class="rating-picker" role="radiogroup" aria-label="Choose a star rating">
          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5" title="5 stars">★</label>
          <input type="radio" id="rating4" name="rating" value="4">
          <label for="rating4" title="4 stars">★</label>
          <input type="radio" id="rating3" name="rating" value="3">
          <label for="rating3" title="3 stars">★</label>
          <input type="radio" id="rating2" name="rating" value="2">
          <label for="rating2" title="2 stars">★</label>
          <input type="radio" id="rating1" name="rating" value="1">
          <label for="rating1" title="1 star">★</label>
        </div>

        <label for="reviewComment">Your Review</label>
        <textarea id="reviewComment" name="comment" rows="4" maxlength="1000"
                  placeholder="Write about your experience..." required></textarea>

        <button class="btn btn-primary review-submit" id="reviewSubmit" type="submit">
          Submit Review
        </button>
        <p class="review-message" id="reviewMessage" role="status" aria-live="polite"></p>
       
      </form>

      <div class="published-reviews">
        <h3>Customer Reviews</h3>
        <div class="review-list" id="reviewList" aria-live="polite">
          <p class="review-empty">Loading reviews...</p>
        </div>
      </div>
    </div>
  </div>
</section>
